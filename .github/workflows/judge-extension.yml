name: Package judge extension
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @friction/extension typecheck
      - run: pnpm --filter @friction/extension test
      - run: pnpm build:ext
      - name: Bundle extension and setup guide
        run: python3 scripts/package-extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: friction-judge-extension-${{ github.sha }}
          path: |
            releases/friction-extension.zip
            releases/friction-extension.zip.sha256
          if-no-files-found: error
