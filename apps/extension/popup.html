<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Friction</title>
    <style>
      :root { --bg:#FDFBF7; --surface:#FFFFFF; --border:#E5E7EB; --text:#1F2937; --muted:#6B7280; --active:#F59E0B; --mastered:#10B981; }
      * { box-sizing: border-box; }
      body { margin: 0; width: 360px; background: var(--bg); color: var(--text); font: 14px/1.4 Nunito, ui-rounded, system-ui, sans-serif; }
      header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
      .brand { font-weight: 800; } .brand span { color: var(--active); }
      .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9CA3AF; }
      main { padding: 14px 16px; display: grid; gap: 14px; }
      .row { display: flex; justify-content: space-between; align-items: center; }
      .label { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
      .concept { font-weight: 700; font-size: 15px; margin: 4px 0 6px; }
      .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #FEF3C7; color: #92400E; font-weight: 700; font-size: 12px; }
      .chip-green { background: #D1FAE5; color: #065F46; }
      .muted { color: var(--muted); font-size: 12px; }
      button { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--active); background: var(--surface); color: #92400E; font: 700 14px Nunito, system-ui, sans-serif; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      .switch { position: relative; width: 38px; height: 22px; } .switch input { opacity: 0; width: 0; height: 0; }
      .slider { position: absolute; inset: 0; background: #D1D5DB; border-radius: 999px; transition: .2s; cursor: pointer; }
      .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
      input:checked + .slider { background: var(--mastered); } input:checked + .slider::before { transform: translateX(16px); }
      details { border-top: 1px solid var(--border); padding-top: 10px; }
      summary { cursor: pointer; font-weight: 700; font-size: 13px; }
      form { display: grid; gap: 8px; margin-top: 8px; }
      input[type=text] { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; font: 12px ui-monospace, monospace; }
      .save { padding: 6px; font-size: 12px; }
      #msg { min-height: 16px; font-size: 12px; color: #92400E; }
      footer { text-align: right; padding: 0 16px 10px; font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span>◆</span> Friction</div>
      <div class="status"><span class="dot" id="status-dot"></span><span id="status">…</span></div>
    </header>
    <main>
      <div class="row">
        <div>Friction enabled</div>
        <label class="switch"><input type="checkbox" id="enabled" /><span class="slider"></span></label>
      </div>
      <section>
        <div class="label">Current concept</div>
        <div id="current" hidden>
          <div class="concept" id="concept"></div>
          <span class="chip" id="chip"></span> <span class="muted" id="friction"></span>
        </div>
        <div id="no-current" class="muted">Ask Claude about something from your course to see your level here.</div>
      </section>
      <section>
        <button id="bypass" disabled>Bypass this message</button>
        <p class="muted">Re-sends your last message to Claude without friction. Uses one bypass and notifies your teacher.</p>
        <div id="msg"></div>
      </section>
      <details>
        <summary>Settings</summary>
        <form id="settings-form">
          <label class="muted">Student ID <input type="text" id="student" /></label>
          <label class="muted">API URL <input type="text" id="api" /></label>
          <button class="save" type="submit">Save</button>
        </form>
      </details>
    </main>
    <footer id="version"></footer>
    <script src="popup.js"></script>
  </body>
</html>
